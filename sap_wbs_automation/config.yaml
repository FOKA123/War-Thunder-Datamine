# =============================================================================
#  Configurare automatizare SAP: WBS nivel 3/4 + norme din devizul general
# -----------------------------------------------------------------------------
#  Regula de îmbinare cu valorile implicite din sapwbs/config.py:
#    - dicționarele se ÎMBINĂ (cheile de aici le suprascriu pe cele implicite);
#    - listele și valorile simple se ÎNLOCUIESC.
#  Cheile necunoscute (greșeli de scriere) opresc programul cu un mesaj clar.
# =============================================================================

excel:
  header_scan_rows: 40            # câte rânduri se scanează pentru a găsi antetul
  max_scan_col: 120               # câte coloane se citesc din fiecare foaie
  skip_hidden_sheets: true
  include_sheets: []              # regex; gol = toate foile vizibile
  exclude_sheets: ["^BackupFormule$", "^Anexa", "vechi"]
  stop_after_empty_rows: 60
  # Coloane logice -> alias-uri. Comparația ignoră majuscule, diacritice și
  # punctuația ("Cod normă" == "cod norma", "Cant." == "cant").
  columns:
    code: ["Cod Norma", "Cod normă", "Cod norma", "Cod articol", "Cod serviciu", "E"]
    quantity: ["Cant.", "Cant", "Cantitate", "Cantitate totala", "Cant. Totala",
               "Cantitate totală", "Norma", "Norme_ore", "Norme ore"]
    network: ["Activitate SAP", "Retea standard", "Retea SAP", "Rețea standard"]
    activity: ["Denumire activitate SAP", "Activitate SAP denumire", "Denumire activitate"]
    part: ["Partea", "Parte"]
    description: ["Descriere", "Descriere normă", "Descriere norma", "Denumire"]
    install_type: ["T.I.", "Instalatia", "Instalația", "Tip instalatie"]
    override: ["Activitate SAP ales", "Activitate SAP aleasa", "Activitate aleasa"]
  required_columns: [code, quantity, network]
  pt_column_regex: '^PT\s*(\d+)$'
  code_regex: '^[A-Z]\d{5}$'

rules:
  allowed_parts: [L, M, S, E]     # I, W, T sunt ignorate (cerință)
  part_order: [L, M, S, E]
  activity_suffix_strip: [NUM]    # "XN4 ... NUM" -> "XN4 ... (L)"
  ambiguity_fallback: first       # first = prima variantă + avertizare | skip = rândul se sare
  context_sheet: Date
  voltage_labels: ["Nivel Tensiune"]
  solution_labels: ["Solutie proiectata"]
  level3_table_headers: ["Activitate SAP", "Nivel 3"]
  # Atributele rețelelor standard: nivelul 3 de rezervă (dacă tabelul din foaia
  # Date lipsește), compatibilitatea cu contextul și denumirea de bază a nivelului 4.
  networks:
    A412: {level3: M1, desc: "APARATAJ"}
    A414: {level3: M1, desc: "TRANSFORMATOR"}
    A441: {level3: M1, desc: "CLADIRE"}
    A451: {level3: M1, voltage: MT, solution: LEA, desc: "LEA MT COND NEIZOLAT"}
    A452: {level3: M1, voltage: MT, solution: LEA, desc: "LEA MT COND IZOLAT"}
    A453: {level3: M1, voltage: MT, solution: LES, desc: "RETEA LES MT"}
    A462: {level3: B1, voltage: JT, solution: LEA, desc: "RETEA LEA JT"}
    A463: {level3: B1, voltage: JT, solution: LES, desc: "RETEA LES JT"}
    A471: {level3: B1, voltage: JT, desc: "BRANSAMENTE JT"}
    A61F: {level3: T1, desc: "TLC"}

wbs:
  level3_code: "+{n3}"                    # +M1 / +B1 / +T1
  level3_desc: {M1: "MEDIE TENSIUNE", B1: "JOASA TENSIUNE", T1: "TELECONTROL"}
  level4_code: "+{net}R{idx}"             # +453R1 ... (net = rețeaua fără "A")
  level4_desc_pt: "{base} PT{pt}"         # ex. "CLADIRE PT2"
  level4_desc_common: "{base}"            # rețea fără alocare pe PT, ex. "RETEA LES MT"
  level4_desc_common_with_pt: "{base} COMUN"
  desc_max_len: 40
  # Valori de proiect citite din Excel. Ordinea căutării:
  #   nume definit (Formulas > Name Manager) > adresă explicită (cell) > etichetă > default.
  # Pentru etichetă: valoarea se ia din prima celulă ne-goală din DREAPTA etichetei.
  project_definition:
    defined_names: [COD_PROIECT]
    labels: ["Cod proiect SAP", "Definitie proiect", "Proiect SAP", "Cod proiect"]
    sheets: [Date]
    cell: ""                              # ex. "Date!C6"
    default: ""
  budget_code:                            # -> câmpul PRPS-ZZCOD_BUGET
    defined_names: [COD_BUGET]
    labels: ["Cod buget", "Cod bugetar", "Cod buget SAP"]
    sheets: [Date]
    cell: ""                              # ex. "Date!C7" când celula va fi stabilită
    default: ""
  location:                               # -> PRPS-STORT (ex. DA1C111)
    labels: ["Locatie SAP", "Locatie"]
    sheets: [Date]
    default: ""
  # Atribuiri pe nivelul 4: posturile (A412/A414/A441) primesc echipamentul (EQUNR),
  # restul locul funcțional (TPLNR). Valorile per PT vin din blocurile PT1/PT2...
  # ale foii Date (etichetele de mai jos), altfel din default_*.
  assignment_field_by_network: {A412: EQUNR, A414: EQUNR, A441: EQUNR}
  assignment_default_field: TPLNR
  pt_assignment_labels: {EQUNR: ["Cod Post"], TPLNR: ["Cod Linie"]}
  default_tplnr: ""
  default_equnr: ""
  level3_tplnr: {}                        # ex. {M1: "DA1033617", B1: "DA1C111", T1: "DA1C610001"}
  budget_on_levels: [4]
  custom_fields_by_network:               # câmpuri client suplimentare (din înregistrare)
    A441: {ZZPARTE: "1"}

sap:
  transaction: CJ02
  system_name: ""                 # ex. "PRD" - gol = orice sistem
  client: ""                      # ex. "100"
  user: ""
  std_network_alternative: QS
  network_popup_values: [AMC, MBT1]   # valorile cerute la crearea antetului de rețea
  purchasing_group: AMC               # AFVGD-EKGRP
  requisitioner: AMC                  # AFVGD-AFNAM
  set_unlimited_overfulfillment: true # ESLL-UEBTK
  price_one_regex: '^E00\d{3}$'       # servicii valorice (ex. E00700): preț brut = 1
  decimal_separator: ","
  quantity_decimals: 3
  busy_timeout_s: 120
  max_popups: 10
  auto_confirm_info_popups: true

output:
  log_dir: logs
  report_dir: rapoarte
  log_level: INFO
